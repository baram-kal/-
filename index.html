:root{

  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bank);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;overflow-x:hidden;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}

.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bank-deep);color:#fff;
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bank-deep)}

#shell{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:20px;

}
.paper{background:var(--paper);padding:22px 20px;box-shadow:0 8px 0 rgba(0,0,0,.18);min-width:0}

.team{background:var(--bank);color:var(--marker);border:0;font-family:var(--display);font-size:22px;aspect-ratio:3/4;max-height:190px;width:100%;box-shadow:0 4px 0 var(--bank-deep)}

.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--line);padding:11px 12px;min-height:58px}

.mini-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--bank);background:#fff;color:var(--bank);padding:6px 10px;font-size:14px;min-height:38px}

.forecast{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-weight:700;padding:10px 0;border-top:2px dashed var(--ink)}
#arena{position:relative;width:100%;height:min(58vh,440px);min-height:300px;background:#20243f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}

.tbar{height:8px;background:var(--line);margin-bottom:8px}.tbar i{display:block;height:100%;background:var(--bad);width:100%}
.barcode{position:absolute;width:112px;height:76px;border:0;padding:8px;background:#fff;transform:translate(-50%,-50%)}

.mosq{position:absolute;width:58px;height:58px;margin:-29px;border:0;background:none;padding:0;font-size:36px;line-height:58px;text-align:center}
.mosq span{display:block;filter:drop-shadow(0 0 2px #fff)}
.mosq.gold span{filter:drop-shadow(0 0 7px #ffd400) drop-shadow(0 0 2px #ffd400)}
.parcel{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(78%,300px);background:#c99a63;padding:14px;text-align:center;box-shadow:0 5px 0 #8c6535}
.parcel div{background:#fff;padding:18px 8px;font-family:var(--display);font-size:clamp(23px,6vw,30px)}
.sort{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.sort button{min-height:68px;font-family:var(--display);font-size:clamp(17px,4.6vw,21px);border:0;background:var(--bank);color:#fff;padding:6px 2px}
.sort small{display:block;font-family:var(--mono);font-size:11px;opacity:.7}
.bubble-row{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:start}
.boss{width:48px;height:48px;background:var(--marker);display:grid;place-items:center;font-size:26px;border-radius:50%}
.bubble{word-break:keep-all;position:relative;background:#eef0ff;padding:12px 14px;border-radius:14px}
.bubble::before{content:"";position:absolute;left:-9px;top:16px;border-style:solid;border-width:7px 10px 7px 0;border-color:transparent #eef0ff transparent transparent}
.hearts{font-size:18px;line-height:1.2;white-space:nowrap}
.barcode.bad{background:#ffd5db;box-shadow:0 0 0 3px var(--bad)}

@keyframes hit{0%{box-shadow:inset 0 0 0 0 var(--bad)}30%{box-shadow:inset 0 0 0 14px var(--bad)}100%{box-shadow:inset 0 0 0 0 var(--bad)}}
.fx{position:absolute;pointer-events:none;color:var(--marker);font-family:var(--mono);font-weight:700;animation:up .6s ease-out forwards;transform:translate(-50%,-50%)}
.fx.minus{color:#ff9aa8}

.rl{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.rl span:first-child{min-width:0;overflow-wrap:anywhere}.rl span:last-child{white-space:nowrap}
.rl.t{font-weight:700;font-size:15px}
.wk-label{font-weight:700;margin-top:6px}

.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scores div{background:#fff;padding:12px;text-align:center;border:2px solid var(--ink)}

.verdict{font-size:clamp(38px,11vw,64px);color:var(--marker);line-height:1.05}
.verdict.bad{color:#ffb3bf}
.board{color:var(--ink)}
.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);margin-right:5px}
.dot.on{background:var(--good)}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{flex:1;background:#fff;border:2px solid var(--ink);padding:5px;font-size:14px;min-height:36px}

.rows{list-style:none;margin:0;padding:0}

.rows li.me{background:#fff7cc}
.rows .rk{font-family:var(--display);font-size:18px;color:var(--bank);text-align:center}

.rows .v{font-family:var(--mono);font-weight:700;text-align:right;white-space:nowrap}
.rows .v.neg{color:var(--bad)}

#sheet,#modal,#pause{position:fixed;inset:0;z-index:40;background:rgba(9,13,70,.72);display:flex;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#sheet{align-items:flex-end;justify-content:center}

#modal>div,#pause>div{background:var(--paper);padding:22px;max-width:380px;width:100%}
#full{color:#fff;text-align:center}#full .paper{text-align:left}
#full .code{font-family:var(--mono);font-size:clamp(32px,7vw,60px);font-weight:700;color:var(--marker);letter-spacing:.08em}
#full .paper{max-width:900px;margin:14px auto 0}
#full .rows li{font-size:clamp(15px,2.2vw,21px)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.progress{font-family:var(--mono);font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.reveal,.fx,#arena.hit{animation:none}}
</style>

const Sync={
  mode:"solo",code:"",players:{},ok:false,timer:null,room:null,spectator:false,pushTimer:null,
  entry(){return S&&S.team?{n:S.name,t:S.team,b:S.bal,s:S.sat,w:S.w,d:S.done?1:0,at:Date.now()}:null},
  fb(){return CONFIG.FIREBASE_URL.replace(/\/+$/,"")+"/rooms/"+this.code+"/players"},
  async start(code,spectator){
    this.stop();this.code=code;this.spectator=!!spectator;this.players={};
    if(!code){this.mode="solo";renderBoards();return}
    if(CONFIG.FIREBASE_URL){this.mode="firebase";this.poll();this.timer=setInterval(()=>this.poll(),CONFIG.POLL_MS);this.push();return}
    this.mode="solo";renderBoards();
    if(!window.claude||!window.claude.use)return;
    try{
      const room=await window.claude.use("room");
      if(!room||this.code!==code)return;
      const r=await room.join(code);
      this.room=r;this.mode="room";
      const onPeers=c=>{c.peers.forEach(p=>{const e=p.presence&&p.presence.p;const id=p.presence&&p.presence.id;if(e&&typeof id==="string")this.players[id]=e});this.ok=r.connected();renderBoards()};
      r.onPeers(onPeers,()=>{this.ok=false;renderBoards()});
      r.onConnection(c=>{this.ok=c;renderBoards()});
      this.push();
    }catch(e){this.mode="solo";renderBoards()}
  },
  stop(){clearInterval(this.timer);this.timer=null;if(this.room){try{this.room.leave()}catch(e){}this.room=null}this.ok=false},
  async poll(){
    try{const r=await fetch(this.fb()+".json",{cache:"no-store"});if(!r.ok)throw 0;this.players=(await r.json())||{};this.ok=true}
    catch(e){this.ok=false}
    renderBoards();
  },
  push(){
    renderBoards();
    if(this.spectator||!S||!S.pid)return;
    clearTimeout(this.pushTimer);
    this.pushTimer=setTimeout(()=>{
      const e=this.entry();if(!e)return;
      if(this.mode==="firebase")fetch(this.fb()+"/"+S.pid+".json",{method:"PUT",body:JSON.stringify(e)}).then(r=>{this.ok=r.ok}).catch(()=>{this.ok=false});
      else if(this.mode==="room"&&this.room)this.room.presence({id:S.pid,p:e}).catch(()=>{});
    },250);
  },
  list(){
    const m={};
    for(const[id,p]of Object.entries(this.players)){
      if(!p||typeof p!=="object")continue;
      const b=Number(p.b),s=Number(p.s);if(!isFinite(b)||!isFinite(s))continue;
      m[id]={id,n:String(p.n||"익명").slice(0,12),t:Number(p.t)||0,b,s,w:Number(p.w)||1,d:!!p.d};
    }
    if(S&&S.team&&!this.spectator){const e=this.entry();m[S.pid]={id:S.pid,n:e.n,t:e.t,b:e.b,s:e.s,w:e.w,d:!!e.d}}
    return Object.values(m);
  }
};

/* 순위: 잔액 등수 + 만족도 등수가 작을수록 앞. 파산 확정자는 맨 뒤. */
function ranked(list,tab){
  const rankOf=(arr,key)=>{const r={};const sorted=[...arr].sort((a,b)=>b[key]-a[key]);sorted.forEach((p,i)=>{r[p.id]=i>0&&sorted[i-1][key]===p[key]?r[sorted[i-1].id]:i+1});return r};
  const bk=p=>p.d&&p.b<0;
  const alive=list.filter(p=>!bk(p)),rb=rankOf(alive,"b"),rs=rankOf(alive,"s");
  alive.forEach(p=>p.score=rb[p.id]+rs[p.id]);
  const cmp={total:(a,c)=>a.score-c.score||c.b-a.b||c.s-a.s,money:(a,c)=>c.b-a.b||c.s-a.s,sat:(a,c)=>c.s-a.s||c.b-a.b}[tab];
  const out=[...alive].sort(cmp);
  out.forEach((p,i)=>{const q=out[i-1];p.rank=q&&cmp(q,p)===0?q.rank:i+1});
  return out.concat(list.filter(bk).sort((a,c)=>c.b-a.b).map(p=>({...p,rank:"-"})));
}
function boardHTML(big){
  const hidden=CONFIG.HIDE_BOARD_IN_WEEK3&&S&&S.team&&S.w===3&&!S.done&&!Sync.spectator;
  const list=Sync.list(),rows=ranked(list,boardTab);
  const status=Sync.mode==="solo"?"혼자 플레이 중":Sync.ok?`실시간 연결 · ${list.length}명`:"연결을 다시 시도하는 중";
  const head=`<div class="board-head"><h3>실시간 순위</h3><span class="muted"><span class="dot ${Sync.mode!=="solo"&&Sync.ok?"on":""}"></span>${status}</span></div>`;
  if(hidden)return head+`<p class="note">3주차에는 순위가 비공개예요. 게임이 끝나면 공개돼요.</p>`;
  const tabs=`<div class="tabs">${[["total","종합"],["money","잔액"],["sat","만족도"]].map(([k,l])=>`<button data-act="tab" data-v="${k}" class="${boardTab===k?"on":""}">${l}</button>`).join("")}</div>`;
  if(!rows.length)return head+tabs+`<p class="muted">참가자가 게임을 시작하면 여기에 순위가 나타나요.</p>`;
  const li=rows.map(p=>`<li class="${S&&p.id===S.pid?"me":""}"><span class="rk">${p.rank}</span><span class="nm">${esc(p.n)}<small>${p.d?(p.b<0?'<span class="bk">파산</span>':"완주"):p.w+"주차 진행 중"}</small></span><span class="v ${p.b<0?"neg":""}">${p.b.toLocaleString("ko-KR")}원</span><span class="v">${p.s}점</span></li>`).join("");
  return head+tabs+`<ol class="rows">${li}</ol>`+(big?"":`<p class="muted" style="margin-top:8px">종합은 잔액 순위와 만족도 순위를 더해 정해요.</p>`);
}

}

function miniStart(){

    $("#tb").style.width=Math.max(0,left/G.len*100)+"%";$("#mtime").textContent=Math.ceil(Math.max(0,left)/1000)+"초";

  const w=S.w,m=CONFIG.MINI[w],base=w===2?G.ok*m.pay+G.gold*m.gold:G.ok*m.pay;let bonus=0;
  if(w===1&&G.ok>=m.bonusAt)bonus+=m.bonus;
  if(w===2&&G.done&&!G.fails&&G.ok+G.gold>0)bonus+=m.noMissBonus;
  if(w===3){bonus+=G.comboPay;if(!G.fails&&G.ok>=m.accuracyMin)bonus+=m.accuracyBonus}
  const pen=G.fails*m.penalty;
  return{base,bonus,pen,total:Math.max(0,Math.min(CONFIG.MINI_MAX_REWARD,base+bonus-pen))};
}
function fx(x,y,t,minus){const el=document.createElement("span");el.className="fx"+(minus?" minus":"");el.textContent=t;el.style.left=x+"%";el.style.top=y+"%";$("#arena").append(el);setTimeout(()=>el.remove(),600)}
function showScore(){$("#mscore").textContent=won(miniPay().total)}
function fail(x,y,why){
  G.fails++;G.lives--;G.combo=0;
  fx(x,y,`${why} -${CONFIG.MINI[S.w].penalty.toLocaleString("ko-KR")}`,true);
  $("#mlives").textContent=hearts();showScore();
  const a=$("#arena");a.classList.remove("hit");void a.offsetWidth;a.classList.add("hit");
  if(G.lives<=0)finishMini(true);
}
function spawnBar(){
  const b=document.createElement("button"),bad=Math.random()<.18,x=14+rnd(72),y=14+rnd(72);
  b.className="barcode"+(bad?" bad":"");b.setAttribute("aria-label",bad?"불량 바코드":"바코드");b.innerHTML="<i></i>";b.style.left=x+"%";b.style.top=y+"%";
  const o={el:b,bad,x,y,born:now(),life:Math.max(1100,1900-G.ok*35)};G.bar=o;
  b.addEventListener("pointerdown",e=>{e.preventDefault();if(paused||!G||G.end)return;b.remove();G.bar=null;
    if(bad)fail(x,y,"불량");else{G.ok++;fx(x,y,"+500");showScore()}
    if(G&&!G.end)spawnBar()});
  $("#arena").append(b);
}
function spawnMos(){
  const r=Math.random(),bee=r<.2,gold=!bee&&r<.32,b=document.createElement("button");
  b.className="mosq"+(gold?" gold":"");b.setAttribute("aria-label",bee?"꿀벌":gold?"황금 모기":"모기");b.innerHTML=`<span>${bee?"🐝":"🦟"}</span>`;
  const o={el:b,gold,bee,x:8+rnd(84),y:8+rnd(84),vx:(rnd(2)?1:-1)*(.012+Math.random()*.03),vy:(rnd(2)?1:-1)*(.012+Math.random()*.03),born:now(),life:bee?3000:4200};
  b.addEventListener("pointerdown",e=>{e.preventDefault();if(paused||!G||G.end)return;b.remove();G.m=G.m.filter(q=>q!==o);
    if(bee)fail(o.x,o.y,"꿀벌");else{gold?G.gold++:G.ok++;fx(o.x,o.y,"+"+(gold?CONFIG.MINI[2].gold:CONFIG.MINI[2].pay).toLocaleString("ko-KR"));showScore()}
    if(G&&!G.end)spawnMos()});
  G.m.push(o);$("#arena").append(b);place(o);
}
function place(o){o.el.style.left=o.x+"%";o.el.style.top=o.y+"%"}
function moveMos(dt){for(const o of G.m){o.x+=o.vx*dt;o.y+=o.vy*dt;if(o.x<6||o.x>94){o.vx*=-1;o.x=Math.min(94,Math.max(6,o.x))}if(o.y<8||o.y>92){o.vy*=-1;o.y=Math.min(92,Math.max(8,o.y))}if(Math.random()<.02)o.vx*=-1;place(o)}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function spawnBox(){
  const R=CONFIG.REGIONS,names=Object.keys(R);let kind,city;
  do{kind=names[rnd(names.length)];city=R[kind][rnd(R[kind].length)]}while(city===G.city);
  G.kind=kind;G.city=city;
  G.opts=shuffle([kind,...shuffle(names.filter(n=>n!==kind)).slice(0,3)]);
  $("#arena").querySelector(".parcel")?.remove();
  $("#arena").insertAdjacentHTML("beforeend",`<div class="parcel"><div>${esc(city)}</div></div>`);
  $("#sortBtns").innerHTML=G.opts.map((n,i)=>`<button data-act="sort" data-v="${esc(n)}"><small>${i+1}</small>${esc(n)}</button>`).join("");
}
function sortBox(k){
  if(!G||G.end||paused||G.w!==3)return;
  const m=CONFIG.MINI[3];
  if(k===G.kind){G.ok++;G.combo++;const c=G.combo%m.comboEvery===0;if(c)G.comboPay+=m.combo;showScore();fx(50,18,c?`${m.comboEvery}연속 +${m.combo.toLocaleString("ko-KR")}`:"+"+m.pay.toLocaleString("ko-KR"));spawnBox()}
  else{fail(50,18,"오분류");if(G&&!G.end)spawnBox()}
}
function finishMini(out){
  const w=S.w,m=CONFIG.MINI[w];G.end=true;G.done=!out;cancelAnimationFrame(G.raf);
  const p=miniPay(),good=G.ok+G.gold,slip={lives:G.lives,ok:good,bad:G.fails,total:good+G.fails,base:p.base,bonusPay:p.bonus,pen:p.pen,reward:p.total,out};
  G=null;
  once("mini"+w,()=>{if(p.total)add(`${m.job} 급여`,p.total);slip.bonus=p.total>0?bonus():false;S.mini[w]=slip});
  render();
}

/* ---------- 입력 처리 ---------- */
const ACT={
  start(){
    const n=$("#nick").value.trim(),e=$("#startErr");
    if(!n){e.hidden=false;e.textContent="닉네임을 입력해 주세요.";return}
    const code=cleanCode($("#roomCode").value);
    const pid=(store.get("bankrupt.pid"))||("p"+Date.now().toString(36)+rnd(1e6).toString(36));store.set("bankrupt.pid",pid);
    S=newGame(n,code,pid);screen="team";save();Sync.start(code);render();
  },
  continue(){S=store.get("bankrupt.game");screen="game";Sync.start(S.code);render()},
  host(){
    const code=cleanCode($("#roomCode").value)||Math.random().toString(36).slice(2,8);
    S=null;screen="full";Sync.start(code,true);render();
  },
  toStart(){Sync.stop();screen="start";location.hash="";render()},
  copyLink(b){navigator.clipboard?.writeText(b.dataset.v).then(()=>{b.textContent="복사했어요"}).catch(()=>{b.textContent=b.dataset.v})},
  pick(b){S.team=+b.dataset.v;screen="reveal";save();Sync.push();render()},
  next(){if(screen==="reveal"){screen="game"}else{S.si++}save();render()},
  nextWeek(){S.w++;S.si=0;S.flashLeft=CONFIG.FLASH_SECONDS;save();Sync.push();render()},
  finish(){screen="end";save();Sync.push();render()},
  cancelOtt(){S.ott=false;save();render()},
  answer(b){const k=+b.dataset.v,i=S.qi;S.qAns[i]=k;if(k===CONFIG.QUIZ[i].a)once("q"+i,()=>add(`퀴즈 ${i+1}번 정답`,CONFIG.QUIZ_REWARD));save();render()},
  quizNext(){if(S.qi+1<CONFIG.QUIZ.length){S.qi++;save();render()}else ACT.next()},
  smish(b){const k=+b.dataset.v,o=CONFIG.SMISHING.options[k];S.smish=k;once("smish",()=>{if(o.amt<0){const sh=pay("스미싱 피해",-o.amt);S.smishAmt=o.amt+sh}else{add("스미싱 대응 보상",o.amt);bonus()}});save();render()},
  essay(){
    const t=$("#essayText").value.trim(),o=CONFIG.ESSAY;if(!t)return;
    const hits=Object.entries(o.keywords).filter(([,ks])=>ks.some(k=>t.includes(k))).map(([k])=>k);
    const pass=t.length>=o.minLength&&hits.length>0;S.essay={text:t,pass,hits};
    if(pass)once("essay",()=>{add("합리적 소비 미션 보상",o.reward);bonus()});save();render();
  },
  laptop(b){
    const c=CONFIG.LAPTOP,opt=b.dataset.v;
    once("laptop",()=>{
      if(opt==="A"){const sv=pay("노트북 정식 수리",c.center);S.laptop={opt,paid:c.center-sv,saved:sv}}
      else{const dice=1+rnd(6);let sv=pay("노트북 사설 수리",c.try),paid=c.try-sv;if(dice>c.successMax){const s2=pay("수리 실패 추가 비용",c.failExtra);paid+=c.failExtra-s2;sv+=s2}S.laptop={opt,dice,paid,saved:sv}}
    });render();
  },
  toggle(b){const id=b.dataset.v;if(S.cart[id]){delete S.cart[id];if(S.abilityOn===id)S.abilityOn=null}else S.cart[id]=1;save();render("it-"+id)},
  book(b){if(S.abilityOn==="book")S.abilityOn=null;S.book=b.dataset.v;save();render("bk-"+b.dataset.v)},
  ability(b){S.abilityOn=S.abilityOn===b.dataset.v?null:b.dataset.v;save();render("ab-"+b.dataset.v)},
  withdraw(){S.savings--;S.sat=Math.max(0,S.sat-CONFIG.SAVING.sat);add("비상금 중도 인출",CONFIG.SAVING.price);save();render()},
  checkout(){if(S.w===1&&!S.book)return;settle();S.si++;save();render()},
  miniStart,
  sort(b){sortBox(b.dataset.v)},
  tab(b){boardTab=b.dataset.v;renderBoards()},
  openSheet(){$("#sheet").hidden=false;renderBoards()},
  closeSheet(){$("#sheet").hidden=true},
  pause(){if(paused)return;paused=true;pauseAt=performance.now();$("#pause").hidden=false},
  resume(){if(!paused)return;paused=false;pausedMs+=performance.now()-pauseAt;$("#pause").hidden=true},
  askRestart(){askModal("지금까지의 기록을 지우고 처음부터 다시 할까요?",()=>{ACT.resume();ACT.restart()})},
  restart(){G=null;store.del("bankrupt.game");Sync.stop();const n=S&&S.name;S=null;screen="start";render();if(n&&$("#nick"))$("#nick").value=n},
  modalNo(){$("#modal").hidden=true},
  modalYes(){$("#modal").hidden=true;modalYes&&modalYes()}
};
function askModal(t,yes){$("#modalText").textContent=t;modalYes=yes;$("#modal").hidden=false}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b&&ACT[b.dataset.act]&&!b.disabled)ACT[b.dataset.act](b)});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&screen==="game"){paused?ACT.resume():ACT.pause()}
  if(G&&G.w===3&&!paused&&G.opts&&["1","2","3","4"].includes(e.key))sortBox(G.opts[+e.key-1])
});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&G&&!paused)ACT.pause()});

/* 시작 */
render();
</script>

</body></html>
